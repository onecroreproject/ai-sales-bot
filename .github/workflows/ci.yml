name: CI Automated Quality & Build Checks

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  code-quality-and-build:
    name: Code Quality, Lint & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend Production Asset Verification
        run: |
          cd frontend
          npm ci
          npm run build
